[project]
name = "todo-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hammad hoath"}
]
requires-python = ">=3.13"
dependencies = [
    "alembic==1.13.3",
    "asyncpg>=0.31.0",
    "fastapi==0.115.0",
    "jwcrypto==1.5.6",
    "passlib[bcrypt]==1.7.4",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.10.3",
    "pydantic-settings==2.5.2",
    "pyjwt==2.9.0",
    "python-jose[cryptography]==3.3.0",
    "python-multipart==0.0.20",
    "requests==2.32.5",
    "sqlmodel==0.0.22",
    "uvicorn[standard]==0.32.0",
]

[project.scripts]
todo-backend = "todo_backend:main"

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"
