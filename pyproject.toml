[project]
name = "todo"
version = "0.1.0"
requires-python = ">=3.13"
description = "In-Memory Python Console Todo Application - Phase I"
readme = "README.md"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.128.0",
    "psycopg2-binary>=2.9.11",
    "pydantic-settings>=2.12.0",
    "pyjwt>=2.10.1",
    "python-multipart>=0.0.21",
    "sqlmodel>=0.0.31",
    "uvicorn>=0.40.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.workspace]
members = [
    "phase-2/backend",
]
